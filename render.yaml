services:
  - type: web
    name: paradox-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paradox-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_FUNNEL_TEST_ACCESS_CODE
        sync: false
      - key: TELEGRAM_SOURCE_CHANNEL_ID
        sync: false
      - key: TEAM_VIP_URL
        sync: false
      - key: POCKET_OPTION_PARTNER_ID
        sync: false
      - key: POCKET_OPTION_API_TOKEN
        sync: false
      - key: POCKET_OPTION_API_BASE_URL
        value: https://affiliate.pocketoption.com/api
      - key: POCKET_OPTION_REF_RU_URL
        sync: false
      - key: POCKET_OPTION_REF_WW_URL
        sync: false
      - key: DEVSBITE_CLIENT_TOKEN
        sync: false
      - key: DEVSBITE_API_BASE_URL
        value: https://api.devsbite.com

  - type: web
    name: paradox-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "24.22.1"

databases:
  - name: paradox-db
    databaseName: trader_mini
    user: trader_mini
